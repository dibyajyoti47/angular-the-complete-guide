<form (ngSubmit)="onSubmit()" #ticketForm>
  <app-control label="Title">
    <input name="title" id="title" #inputForContentChild [(ngModel)]= "enteredTitle"/>
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request" rows="3" #inputForContentChild [(ngModel)]= "enteredText"></textarea>
  </app-control>
  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon">⌲</span>
    </button>
  </p>
</form>
